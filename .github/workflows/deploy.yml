name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: stmmez.beget.tech
          username: stmmez
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /stmmez/bss.stmmez.beget.tech/public_html/
          dangerous-clean-slate: true
